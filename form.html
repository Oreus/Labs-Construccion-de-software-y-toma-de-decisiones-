<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Formularios HTML</title>
</head>
<body>
    <h2>Formulario de Prueba POST</h2>
    <form method="POST" action="/formulario/form_method">
        <label>Índice:</label><br/>
        <input type="number" name="indice" placeholder="Escribe un número" required>
        <br/><br/>
        
        <label>Valor a imprimir:</label><br/>
        <input type="text" name="imprimir" placeholder="Escribe un texto" required>
        <br/><br/>
        
        <input type="submit" value="Enviar al Servidor">
    </form>
</body>
</html>
